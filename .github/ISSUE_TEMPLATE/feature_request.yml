name: 功能建议
description: 提出一个新能力或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么
      description: 描述场景和痛点，而不是直接给方案——方案可能有更简单的做法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: false

  - type: dropdown
    id: layer
    attributes:
      label: 你认为应该落在哪一层
      description: 选不准也没关系，这里只是帮助定位。
      options:
        - 不确定
        - Android App（原生能力）
        - 移动端 Web（表现层插件 / CSS）
        - 手机桥（新的 phone_* 工具）
        - 部署与运维
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > 提醒：本项目的移动端界面走 WebView + 服务端 CSS 注入，
        > 而不是原生重写（理由见 [ADR-0007](../blob/master/docs/adr/0007-mobile-presentation-layer.md)）。
        > 如果你的需求是"更像原生 App"，请说明具体是哪种表现（滚动、长按菜单、过渡动画…），
        > 有些能用 CSS 解决，有些必须原生实现。
