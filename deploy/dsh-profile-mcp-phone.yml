# Adds the phone bridge as an MCP server to the `web` profile.
# Apply one of two ways:
#   1. one-off:      dsh --profile web --patch ~/workspace/dsh-mobile/deploy/dsh-profile-mcp-phone.yml
#   2. permanently:  append the entry below to ~/.dsh/profiles/web/cordis.patch.yml
# Either way the running `dsh web` process must be restarted for it to take effect.
- insert:
    - id: mcp-phone
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: phone
        transport: streamable-http
        url: http://127.0.0.1:3082/mcp
        failOnStartupError: false
